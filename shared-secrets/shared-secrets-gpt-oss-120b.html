<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shared Secrets</title>
<style>
  body{font-family:sans-serif;max-width:800px;margin:auto;padding:1rem;}
  textarea{width:100%;height:8rem;box-sizing:border-box;}
  button{margin:0.5rem 0;}
  label{font-weight:bold;display:block;margin-top:1rem;}
</style>
</head>
<body>
<h1>Shared Secrets</h1>

<section id="keygen">
  <h2>Key Pair Generation</h2>
  <button id="genKeyBtn">Generate RSA‑4096 Key Pair</button>
  <div>
    <label for="publicKey">Public Key (PEM):</label>
    <textarea id="publicKey" readonly></textarea>
    <label for="privateKey">Private Key (PEM):</label>
    <textarea id="privateKey" readonly></textarea>
  </div>
</section>

<section id="encrypt">
  <h2>Encrypt Message</h2>
  <label for="encPublicKey">Recipient's Public Key (PEM):</label>
  <textarea id="encPublicKey"></textarea>
  <label for="plaintext">Plaintext:</label>
  <textarea id="plaintext"></textarea>
  <button id="encryptBtn">Encrypt</button>
  <label for="ciphertext">Ciphertext (Base64):</label>
  <textarea id="ciphertext" readonly></textarea>
</section>

<section id="decrypt">
  <h2>Decrypt Message</h2>
  <label for="decPrivateKey">Your Private Key (PEM):</label>
  <textarea id="decPrivateKey"></textarea>
  <label for="decCiphertext">Ciphertext (Base64):</label>
  <textarea id="decCiphertext"></textarea>
  <button id="decryptBtn">Decrypt</button>
  <label for="decrypted">Decrypted Plaintext:</label>
  <textarea id="decrypted" readonly></textarea>
</section>

<script>
/* Utility functions */
function arrayBufferToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}
function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}
function formatPem(pemType, b64) {
  const lineLength = 64;
  const lines = [];
  for (let i = 0; i < b64.length; i += lineLength) {
    lines.push(b64.slice(i, i + lineLength));
  }
  return `-----BEGIN ${pemType}-----\n${lines.join('\n')}\n-----END ${pemType}-----`;
}
function stripPem(pem) {
  return pem.replace(/-----BEGIN [A-Z ]+-----/, '')
            .replace(/-----END [A-Z ]+-----/, '')
            .replace(/\s/g, '');
}

/* Key Generation */
document.getElementById('genKeyBtn').addEventListener('click', async () => {
  const keyPair = await crypto.subtle.generateKey(
    {
      name: 'RSA-OAEP',
      modulusLength: 4096,
      publicExponent: new Uint8Array([1, 0, 1]),
      hash: 'SHA-256'
    },
    true,
    ['encrypt', 'decrypt']
  );
  const spki = await crypto.subtle.exportKey('spki', keyPair.publicKey);
  const pkcs8 = await crypto.subtle.exportKey('pkcs8', keyPair.privateKey);
  const pubPem = formatPem('PUBLIC KEY', arrayBufferToBase64(spki));
  const privPem = formatPem('PRIVATE KEY', arrayBufferToBase64(pkcs8));
  document.getElementById('publicKey').value = pubPem;
  document.getElementById('privateKey').value = privPem;
});

/* Encryption */
document.getElementById('encryptBtn').addEventListener('click', async () => {
  const pubPem = document.getElementById('encPublicKey').value.trim();
  const plaintext = document.getElementById('plaintext').value;
  if (!pubPem || !plaintext) return;
  const spkiB64 = stripPem(pubPem);
  const publicKey = await crypto.subtle.importKey(
    'spki',
    base64ToArrayBuffer(spkiB64),
    { name: 'RSA-OAEP', hash: 'SHA-256' },
    false,
    ['encrypt']
  );
  const encoder = new TextEncoder();
  const data = encoder.encode(plaintext);
  const encrypted = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, publicKey, data);
  const ciphertextB64 = arrayBufferToBase64(encrypted);
  document.getElementById('ciphertext').value = ciphertextB64;
});

/* Decryption */
document.getElementById('decryptBtn').addEventListener('click', async () => {
  const privPem = document.getElementById('decPrivateKey').value.trim();
  const ciphertextB64 = document.getElementById('decCiphertext').value.trim();
  if (!privPem || !ciphertextB64) return;
  const pkcs8B64 = stripPem(privPem);
  const privateKey = await crypto.subtle.importKey(
    'pkcs8',
    base64ToArrayBuffer(pkcs8B64),
    { name: 'RSA-OAEP', hash: 'SHA-256' },
    false,
    ['decrypt']
  );
  const encryptedBuf = base64ToArrayBuffer(ciphertextB64);
  const decrypted = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, privateKey, encryptedBuf);
  const decoder = new TextDecoder();
  const plaintext = decoder.decode(decrypted);
  document.getElementById('decrypted').value = plaintext;
});
</script>

</body>
</html>
